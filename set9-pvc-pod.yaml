
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: set9-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: set9-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.28
      ports:
        - containerPort: 80
      volumeMounts:
        - name: storage
          mountPath: /usr/share/nginx/html/data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: set9-pvc
