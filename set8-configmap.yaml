
apiVersion: v1
kind: ConfigMap
metadata:
  name: set8-app-config
data:
  APP_MESSAGE: "Hello from Kubernetes ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set8-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set8-web
  template:
    metadata:
      labels:
        app: set8-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: set8-app-config
                  key: APP_MESSAGE
