
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-web
  template:
    metadata:
      labels:
        app: exam-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: exam-web-service
spec:
  type: NodePort
  selector:
    app: exam-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
