
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set10-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set10-web
  template:
    metadata:
      labels:
        app: set10-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
