
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set4-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: set4-web
  template:
    metadata:
      labels:
        app: set4-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
