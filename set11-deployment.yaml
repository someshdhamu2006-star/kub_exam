
apiVersion: apps/v1
kind: Deployment
metadata:
  name: set11-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set11-web
  template:
    metadata:
      labels:
        app: set11-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
